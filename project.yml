name: Fueli
options:
  bundleIdPrefix: com.welford.fueli
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release
  Free: debug

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.12"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_PREVIEWS: YES

targets:
  Fueli:
    type: application
    platform: iOS
    sources:
      - path: Fueli
        excludes:
          - "**/.DS_Store"
          - "**/*.md"
      - path: Fueli/Services/fdc_ingredient_prompt.md
        buildPhase: resources
    configFiles:
      Debug: Fueli/Secrets.xcconfig
      Release: Fueli/Secrets.xcconfig
      Free: Fueli/Secrets.xcconfig
    info:
      path: Fueli/Resources/Info.plist
      properties:
        CFBundleDisplayName: Fueli
        USDA_API_KEY: "$(USDA_API_KEY)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "Fueli uses your camera to identify food and estimate its nutrition."
        NSPhotoLibraryUsageDescription: "Fueli lets you pick photos of meals to log their nutrition."
        ITSAppUsesNonExemptEncryption: false
        NSHealthShareUsageDescription: "Fueli reads active and resting calories from Apple Health to estimate total daily energy needs."
        NSHealthUpdateUsageDescription: "Fueli can save workouts and weight entries you log back to Health."
        NSMotionUsageDescription: "Fueli tracks workout steps and distance using the motion sensor."
    entitlements:
      path: Fueli/Resources/Fueli.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.welford.fueli
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
      configs:
        Release:
          USDA_API_KEY: ""
        Free:
          USDA_API_KEY: ""
          CODE_SIGN_ENTITLEMENTS: Fueli/Resources/Fueli-Free.entitlements
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) HEALTHKIT_DISABLED"
  FueliTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FueliTests
    dependencies:
      - target: Fueli
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.welford.fueli.tests
schemes:
  Fueli:
    build:
      targets:
        Fueli: all
    test:
      config: Debug
      targets:
        - FueliTests
    run:
      config: Debug
    archive:
      config: Release
